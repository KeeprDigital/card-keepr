name: official-source-recapture

# Scheduled runs use the default branch. GitHub disables public-repository
# schedules after 60 inactive days; monthly liveness checks and re-enabling
# instructions are in the retained fixture README.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 2" # Weekly Tuesday 04:23 UTC, away from the hour boundary.

permissions:
  contents: read

concurrency:
  group: official-source-recapture
  cancel-in-progress: false

jobs:
  recapture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up repository tooling
        uses: ./.github/actions/setup-toolchain
      - name: Verify recapture report contracts
        run: node --test acceptance/retained-recapture*.test.mjs
      - name: Verify retained digests and recapture official responses
        run: node scripts/recapture-official-bytes.mjs "$RUNNER_TEMP/official-source-recapture"
      - name: Retain recaptured bytes and drift report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-source-recapture
          path: ${{ runner.temp }}/official-source-recapture
          retention-days: 14
          if-no-files-found: error

  report-failure:
    needs: recapture
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: "official-source: retained bytes drift or recapture failure"
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Open or update the recapture issue
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body_file="${RUNNER_TEMP}/recapture-issue.md"
          printf 'The retained Official Source recapture failed.\n\n- Run: %s\n- Trigger: `%s`\n- Commit: `%s`\n\nDownload the `official-source-recapture` artifact and inspect `report.json`. It distinguishes changed adapter observations or discovery, structural failures, cosmetic bytes, unresolved drift, retained-evidence integrity failures, and transport failures. Complete new response bodies are retained beside the exact-range capture records. Review the publisher output before updating any golden bytes. Resolve actionable and unresolved drift, then record a successful default-branch scheduled run before closing; a manual run alone is not scheduled proof. Cadence and liveness instructions: `acceptance/fixtures/retained-official-source/README.md`.\n' "${run_url}" "${EVENT_NAME}" "${GITHUB_SHA}" > "${body_file}"
          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --label bug --search "\"${TITLE}\" in:title" --json number,title --jq '[.[] | select(.title == env.TITLE)] | .[0].number // empty')"
          if test -n "${existing}"; then
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body-file "${body_file}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --label bug --body-file "${body_file}"
          fi
