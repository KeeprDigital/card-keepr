name: dev-deploy
run-name: dev-${{ github.event.workflow_run.head_sha }}
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: dev-deployment
  cancel-in-progress: false
jobs:
  dev:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    permissions:
      contents: read
      checks: read
      actions: read
      id-token: write
    env:
      RELEASE_ENVIRONMENT: dev
      EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.DEV_CLOUDFLARE_ACCOUNT_ID }}
      DEV_CLOUDFLARE_ACCOUNT_ID: ${{ vars.DEV_CLOUDFLARE_ACCOUNT_ID }}
      DEV_CATALOGUE_DATABASE_ID: ${{ vars.DEV_CATALOGUE_DATABASE_ID }}
      DEV_DISPOSABLE_DATABASE_ID: ${{ vars.DEV_DISPOSABLE_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.DEV_DEPLOYMENT_TOKEN }}
      API_BASE_URL: https://dev.card.keepr.digital/api
      API_TRAFFIC_TOKEN: ${{ secrets.DEV_API_TRAFFIC_TOKEN }}
      RELEASE_STATE_CONFIG: apps/ingestion/wrangler.dev.json
      API_RELEASE_CONFIG: apps/api/wrangler.dev.json
      INGESTION_RELEASE_CONFIG: apps/ingestion/wrangler.dev.json
    steps:
      - name: Check out the exact passing merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Authenticate workflow intent and exact-commit CI to dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/dev-prepare.mjs
      - name: Compile isolated dev identities from the prepared target
        run: node scripts/dev-environment.mjs
      - name: Execute the guarded dev deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deploy-dev.mjs
