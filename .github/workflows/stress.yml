name: stress

# Cron liveness (issue #75): GitHub runs a schedule only from the default
# branch, disables it after 60 days without repository activity, and disables
# it when the last actor to touch this file loses repository access. A
# disabled schedule fails nothing and notifies nobody, so a quiet stress
# workflow is not evidence that the stress suite passes. The check and the
# re-enable command are in docs/runbooks/scheduled-stress.md.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Bounded weekly pacing checks or all capacity experiments"
        type: choice
        options: [bounded, full]
        default: bounded
  schedule:
    # Weekly, Monday 03:17 UTC — off the busy top-of-hour cron window.
    - cron: "17 3 * * 1"

concurrency:
  group: stress-${{ github.event_name }}-${{ github.ref }}-${{ inputs.suite || 'bounded' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.suite == 'full' && 45 || 5 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: node
        with:
          node-version: 22
          package-manager-cache: false
      - name: Set up Corepack and pnpm
        id: pnpm
        run: bash scripts/setup-pnpm.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pnpm-store
        with:
          path: ${{ steps.pnpm.outputs.store-path }}
          key: pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ steps.pnpm.outputs.version }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'pnpm-workspace.yaml', '.npmrc', 'scripts/setup-pnpm.sh') }}
      # Always recreate node_modules and run approved native builds, even on a store hit.
      - run: pnpm install --frozen-lockfile
      - if: inputs.suite != 'full'
        run: pnpm run test:stress
      - if: inputs.suite == 'full'
        run: pnpm run test:stress:full

  # Nobody watches a scheduled run, so a failure opens one `bug` issue (or
  # comments on the open one) with the run link. The issue is the only place
  # the failure surfaces; the stress job itself keeps its read-only token.
  report-failure:
    needs: stress
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: "stress: scheduled stress suite failed"
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Open or update the stress failure issue
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="$(printf 'The `stress` workflow failed.\n\n- Run: %s\n- Trigger: `%s`\n- Commit: `%s`\n\nInspect the run log, fix or file the regression, then close this issue. See `docs/runbooks/scheduled-stress.md`.\n' "${run_url}" "${EVENT_NAME}" "${GITHUB_SHA}")"
          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --label bug --search "\"${TITLE}\" in:title" --json number,title --jq '[.[] | select(.title == env.TITLE)] | .[0].number // empty')"
          if test -n "${existing}"; then
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --label bug --body "${body}"
          fi
