name: production-release
run-name: production-release-${{ inputs.release_id }}-${{ inputs.expected_head_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_account_id:
        required: true
        type: string
      expected_head_sha:
        required: true
        type: string
      expected_actor:
        required: true
        type: string
      operation:
        required: false
        default: production_release
        type: choice
        options: [production_release]
      release_id:
        required: false
        type: string
      expected_current_revision:
        required: false
        type: string
      expected_migration_level:
        required: false
        type: string
      production_target_json:
        required: false
        type: string
      production_target_digest:
        required: false
        type: string
      recovery_bookmark:
        required: false
        type: string
      recovery_backup_attempt_id:
        required: false
        type: string
      smoke_targets_json:
        required: false
        type: string
      retained_revision_evidence_json:
        required: false
        type: string
      replacement_recovery_id:
        required: false
        default: none
        type: string
      replacement_database_id:
        required: false
        default: none
        type: string
      retained_database_id:
        required: false
        default: none
        type: string
      replacement_target_digest:
        required: false
        default: none
        type: string
      idempotency_key:
        required: false
        type: string
      dispatch_digest:
        required: false
        type: string
      prepared_plan_json:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  guarded-release:
    if: inputs.operation == 'production_release'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOYMENT_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ inputs.expected_account_id }}
      RELEASE_ID: ${{ inputs.release_id }}
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      EXPECTED_ACTOR: ${{ inputs.expected_actor }}
      EXPECTED_CURRENT_REVISION: ${{ inputs.expected_current_revision }}
      EXPECTED_MIGRATION_LEVEL: ${{ inputs.expected_migration_level }}
      PRODUCTION_TARGET_JSON: ${{ inputs.production_target_json }}
      PRODUCTION_TARGET_DIGEST: ${{ inputs.production_target_digest }}
      RECOVERY_BOOKMARK: ${{ inputs.recovery_bookmark }}
      RECOVERY_BACKUP_ATTEMPT_ID: ${{ inputs.recovery_backup_attempt_id }}
      SMOKE_TARGETS_JSON: ${{ inputs.smoke_targets_json }}
      RETAINED_REVISION_EVIDENCE_JSON: ${{ inputs.retained_revision_evidence_json }}
      REPLACEMENT_RECOVERY_ID: ${{ inputs.replacement_recovery_id }}
      REPLACEMENT_DATABASE_ID: ${{ inputs.replacement_database_id }}
      RETAINED_DATABASE_ID: ${{ inputs.retained_database_id }}
      REPLACEMENT_TARGET_DIGEST: ${{ inputs.replacement_target_digest }}
      IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
      DISPATCH_DIGEST: ${{ inputs.dispatch_digest }}
      PREPARED_PLAN_JSON: ${{ inputs.prepared_plan_json }}
      RELEASE_STATE_CONFIG: apps/ingestion/wrangler.jsonc
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      API_TRAFFIC_TOKEN: ${{ secrets.API_TRAFFIC_TOKEN }}
    steps:
      - name: Check out the exact guarded release
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate the exact prepared dispatch before mutation
        run: node scripts/production-release.mjs validate-dispatch /tmp/production-release
      - name: Verify Cloudflare credential and immutable target
        run: node scripts/production-release-provider.mjs verify-target >/dev/null
      - name: Recheck live Production Release gates without mutation
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute CATALOGUE_DB --remote --json --config apps/ingestion/wrangler.jsonc --file /tmp/production-release/live-preflight.sql)"
          test "$(jq -r '.[-1].results[0].ready' <<<"${result}")" = 1
      - name: Claim the prepared pre-migration fence
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute CATALOGUE_DB --remote --json --config apps/ingestion/wrangler.jsonc --file /tmp/production-release/claim.sql)"
          test "$(jq -r '.[-1].results[0].changed_rows' <<<"${result}")" = 1
          test "$(jq -r '.[-1].results[0].claimed' <<<"${result}")" = 1
      - name: Apply compatible forward migrations
        run: |
          set -euo pipefail
          release_migration_exit() {
            original_status=$?
            trap - EXIT
            if test "${original_status}" -ne 0; then
              set +e
              bash scripts/production-release-failure.sh /tmp/production-release
              handler_status=$?
              printf 'Production Release failure handler status: %s\n' "${handler_status}"
              exit "${original_status}"
            fi
          }
          trap release_migration_exit EXIT
          marker="$(npx wrangler d1 execute CATALOGUE_DB --remote --json --config apps/ingestion/wrangler.jsonc --file /tmp/production-release/migration-started.sql)"
          test "$(jq -r '.[-1].results[0].changed_rows' <<<"${marker}")" = 1
          test "$(jq -r '.[-1].results[0].migration_started' <<<"${marker}")" = 1
          npx wrangler d1 migrations apply CATALOGUE_DB --remote --config apps/ingestion/wrangler.jsonc
          trap - EXIT
      - name: Transfer bootstrap evidence to the durable Production Release
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute CATALOGUE_DB --remote --json --config apps/ingestion/wrangler.jsonc --file /tmp/production-release/materialize.sql)"
          test "$(jq -r '.[-1].results[0].transition_rows' <<<"${result}")" = 3
          test "$(jq -r '.[-1].results[0].transferred' <<<"${result}")" = 1
      - name: Bind an exact verified replacement D1 when requested
        run: |
          set -euo pipefail
          api_config=apps/api/wrangler.release.json
          ingestion_config=apps/ingestion/wrangler.release.json
          release_state_config=apps/ingestion/wrangler.jsonc
          if test "${REPLACEMENT_DATABASE_ID}" = none; then
            cp apps/api/wrangler.jsonc "${api_config}"
            cp apps/ingestion/wrangler.jsonc "${ingestion_config}"
          else
            node scripts/production-release.mjs replacement-configs "${REPLACEMENT_DATABASE_ID}" "${api_config}" "${ingestion_config}"
            npx wrangler d1 migrations apply CATALOGUE_DB --remote --config "${ingestion_config}"
            handoff_result="$(npx wrangler d1 execute CATALOGUE_DB --remote --json --config apps/ingestion/wrangler.jsonc --file /tmp/production-release/replacement-handoff.sql)"
            handoff="$(jq -er 'if length == 1 and (.[0].results | length) == 1 and (.[0].results[0].handoff_json | type) == "string" then .[0].results[0].handoff_json else error("invalid replacement handoff result") end' <<<"${handoff_result}")"
            KEEPR_REPLACEMENT_HANDOFF_EVIDENCE="${handoff}" node scripts/production-release.mjs replacement-seed /tmp/production-release/replacement-seed.sql
            seed_result="$(npx wrangler d1 execute CATALOGUE_DB --remote --json --config "${ingestion_config}" --file /tmp/production-release/replacement-seed.sql)"
            test "$(jq -r '.[-1].results[0].seeded' <<<"${seed_result}")" = 1
            release_state_config="${ingestion_config}"
          fi
          printf 'API_RELEASE_CONFIG=%s\nINGESTION_RELEASE_CONFIG=%s\nRELEASE_STATE_CONFIG=%s\n' "${api_config}" "${ingestion_config}" "${release_state_config}" >> "${GITHUB_ENV}"
      - name: Upload immutable Worker versions
        run: |
          set -euo pipefail
          npx wrangler versions upload --strict --config "${API_RELEASE_CONFIG}" --tag "release-${RELEASE_ID}-api" --message "${RELEASE_ID} ${EXPECTED_HEAD_SHA}"
          npx wrangler versions upload --strict --config "${INGESTION_RELEASE_CONFIG}" --tag "release-${RELEASE_ID}-ingestion" --message "${RELEASE_ID} ${EXPECTED_HEAD_SHA}"
          result="$(npx wrangler d1 execute CATALOGUE_DB --remote --json --config "${RELEASE_STATE_CONFIG}" --file /tmp/production-release/deploying.sql)"
          test "$(jq -r '.[-1].results[0].changed_rows' <<<"${result}")" = 1
          test "$(jq -r '.[-1].results[0].transitioned' <<<"${result}")" = 1
      - name: Verify the uploaded versions bind the release configuration
        run: |
          set -euo pipefail
          RELEASE_WORKER=card-keepr-api RELEASE_VERSION_TAG="release-${RELEASE_ID}-api" RELEASE_WORKER_CONFIG="${API_RELEASE_CONFIG}" node scripts/production-release-provider.mjs verify-version >/dev/null
          RELEASE_WORKER=card-keepr-ingestion RELEASE_VERSION_TAG="release-${RELEASE_ID}-ingestion" RELEASE_WORKER_CONFIG="${INGESTION_RELEASE_CONFIG}" node scripts/production-release-provider.mjs verify-version >/dev/null
      - name: Activate the compatible version pair
        run: |
          set -euo pipefail
          npx wrangler versions deploy --yes --config "${API_RELEASE_CONFIG}" --version-tag "release-${RELEASE_ID}-api@100%"
          npx wrangler versions deploy --yes --config "${INGESTION_RELEASE_CONFIG}" --version-tag "release-${RELEASE_ID}-ingestion@100%"
      - name: Observe the binding while recovery remains blocked
        run: |
          set -euo pipefail
          binding="$(node scripts/production-release-provider.mjs observe-bindings)"
          KEEPR_RELEASE_EVIDENCE="${binding}" node scripts/production-release.mjs evidence-sql binding "${RELEASE_ID}" /tmp/production-release/binding.sql
          result="$(npx wrangler d1 execute CATALOGUE_DB --remote --json --config "${RELEASE_STATE_CONFIG}" --file /tmp/production-release/binding.sql)"
          test "$(jq -r '.[-1].results[0].changed_rows' <<<"${result}")" = 1
          test "$(jq -r '.[-1].results[0].transitioned' <<<"${result}")" = 1
      - name: Run black-box production smoke checks
        run: |
          set -euo pipefail
          smoke_input="$(jq -cn --arg url "${API_BASE_URL}" --arg key "${API_TRAFFIC_TOKEN}" --arg revision "${EXPECTED_CURRENT_REVISION}" --argjson targets "${SMOKE_TARGETS_JSON}" '{apiUrl:$url,apiKey:$key,currentRevisionId:$revision,revisions:$targets.revisions,printingImageId:$targets.printing_image_id,legalityCardId:$targets.legality_card_id,legalityDate:(now|strftime("%Y-%m-%d")),legalityFormat:$targets.legality_format,legalityRegion:$targets.legality_region,staleCursor:$targets.stale_cursor,staleRevisionId:$targets.stale_revision_id}')"
          smoke="$(KEEPR_SMOKE_INPUT="${smoke_input}" node scripts/production-smoke.mjs)"
          KEEPR_RELEASE_EVIDENCE="${smoke}" node scripts/production-release.mjs evidence-sql smoke "${RELEASE_ID}" /tmp/production-release/smoke.sql
          result="$(npx wrangler d1 execute CATALOGUE_DB --remote --json --config "${RELEASE_STATE_CONFIG}" --file /tmp/production-release/smoke.sql)"
          test "$(jq -r '.[-2].results[0].changed_rows' <<<"${result}")" = 1
          test "$(jq -r '.[-2].results[0].transitioned' <<<"${result}")" = 1
          test "$(jq -r '.[-1].results[0].changed_rows' <<<"${result}")" = 1
          test "$(jq -r '.[-1].results[0].fence_released' <<<"${result}")" = 1
      - name: Record compatible roll-forward requirement on failure
        if: failure()
        run: |
          set +e
          bash scripts/production-release-failure.sh /tmp/production-release
          handler_status=$?
          exit "${handler_status}"
