name: production-release
run-name: production-release-${{ inputs.release_id }}-${{ inputs.expected_head_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_account_id:
        required: true
        type: string
      expected_head_sha:
        required: true
        type: string
      expected_actor:
        required: true
        type: string
      operation:
        required: false
        default: production_release
        type: choice
        options: [production_release, cancel_fresh_baseline_handoff, correct_fresh_baseline_handoff]
      release_id:
        required: false
        type: string
      expected_current_revision:
        required: false
        type: string
      # "true" only while the catalogue is provably empty (issue #141): the
      # validator, live gate, and CLI all refuse a bootstrap dispatch once a
      # Catalogue Revision exists.
      bootstrap:
        required: false
        default: "false"
        type: string
      expected_migration_level:
        required: false
        type: string
      production_target_json:
        required: false
        type: string
      production_target_digest:
        required: false
        type: string
      recovery_bookmark:
        required: false
        type: string
      recovery_backup_attempt_id:
        required: false
        type: string
      smoke_targets_json:
        required: false
        type: string
      retained_revision_evidence_json:
        required: false
        type: string
      replacement_recovery_id:
        required: false
        default: none
        type: string
      replacement_database_id:
        required: false
        default: none
        type: string
      retained_database_id:
        required: false
        default: none
        type: string
      replacement_target_digest:
        required: false
        default: none
        type: string
      idempotency_key:
        required: false
        type: string
      dispatch_digest:
        required: false
        type: string
      correction_json:
        required: false
        type: string
      correction_digest:
        required: false
        type: string
      prepared_plan_json:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  guarded-release:
    if: inputs.operation == 'production_release' || inputs.operation == 'cancel_fresh_baseline_handoff' || inputs.operation == 'correct_fresh_baseline_handoff'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    # checks are read for the exact-SHA gate below;
    # the workflow token writes nothing.
    permissions:
      contents: read
      checks: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOYMENT_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ inputs.expected_account_id }}
      HANDOFF_CORRECTION_JSON: ${{ inputs.correction_json }}
      HANDOFF_CORRECTION_DIGEST: ${{ inputs.correction_digest }}
      HANDOFF_OPERATION: ${{ inputs.operation }}
      HANDOFF_EXECUTION_ID: ${{ github.run_id }}:${{ github.run_attempt }}
      RELEASE_ID: ${{ inputs.release_id }}
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      EXPECTED_ACTOR: ${{ inputs.expected_actor }}
      EXPECTED_CURRENT_REVISION: ${{ inputs.expected_current_revision }}
      BOOTSTRAP: ${{ inputs.bootstrap }}
      EXPECTED_MIGRATION_LEVEL: ${{ inputs.expected_migration_level }}
      PRODUCTION_TARGET_JSON: ${{ inputs.production_target_json }}
      PRODUCTION_TARGET_DIGEST: ${{ inputs.production_target_digest }}
      RECOVERY_BOOKMARK: ${{ inputs.recovery_bookmark }}
      RECOVERY_BACKUP_ATTEMPT_ID: ${{ inputs.recovery_backup_attempt_id }}
      SMOKE_TARGETS_JSON: ${{ inputs.smoke_targets_json }}
      RETAINED_REVISION_EVIDENCE_JSON: ${{ inputs.retained_revision_evidence_json }}
      REPLACEMENT_RECOVERY_ID: ${{ inputs.replacement_recovery_id }}
      REPLACEMENT_DATABASE_ID: ${{ inputs.replacement_database_id }}
      RETAINED_DATABASE_ID: ${{ inputs.retained_database_id }}
      REPLACEMENT_TARGET_DIGEST: ${{ inputs.replacement_target_digest }}
      IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
      DISPATCH_DIGEST: ${{ inputs.dispatch_digest }}
      PREPARED_PLAN_JSON: ${{ inputs.prepared_plan_json }}
      RELEASE_STATE_CONFIG: apps/ingestion/wrangler.jsonc
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      API_TRAFFIC_TOKEN: ${{ secrets.API_TRAFFIC_TOKEN }}
    steps:
      # Before checkout or mutation, require complete successful checks on the
      # exact immutable deployed commit. PR-head evidence cannot authorize a
      # merge commit. The contract test pins the expected jobs to ci.yml.
      - name: Verify the release SHA is contained in main and passed ci
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_CI_CHECKS: '["lint", "checks", "domain-tests", "ingestion-tests (1)", "ingestion-tests (2)", "ingestion-tests (3)", "acceptance (1)", "acceptance (2)", "acceptance (3)"]'
        run: |
          set -euo pipefail
          printf '%s\n' "${EXPECTED_HEAD_SHA}" | grep -Eq '^[0-9a-f]{40}$'
          compare="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${EXPECTED_HEAD_SHA}")"
          case "$(jq -r '.status' <<<"${compare}")" in
            identical|behind) ;;
            *) printf 'expected_head_sha %s is not contained in main: %s\n' "${EXPECTED_HEAD_SHA}" "$(jq -c '{status, ahead_by, behind_by}' <<<"${compare}")"; exit 1 ;;
          esac
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_HEAD_SHA}/check-runs?filter=latest&per_page=100" --paginate --slurp --jq '[.[].check_runs[] | select(.app.slug == "github-actions") | {name, head_sha, status, conclusion}]')"
          while IFS= read -r job; do
            matched="$(jq -c --arg job "${job}" '[.[] | select(.name == $job)]' <<<"${runs}")"
            if test "$(jq 'length' <<<"${matched}")" != 1; then
              printf 'ci job %s does not have exactly one latest check run on %s\n' "${job}" "${EXPECTED_HEAD_SHA}"; exit 1
            fi
            if test "$(jq --arg sha "${EXPECTED_HEAD_SHA}" '[.[] | select(.head_sha != $sha or .status != "completed" or .conclusion != "success")] | length' <<<"${matched}")" != 0; then
              printf 'ci job %s did not succeed on %s: %s\n' "${job}" "${EXPECTED_HEAD_SHA}" "${matched}"; exit 1
            fi
          done < <(jq -r '.[]' <<<"${REQUIRED_CI_CHECKS}")
          printf 'release SHA %s is contained in main (%s) and passed ci on %s\n' "${EXPECTED_HEAD_SHA}" "$(jq -r '.status' <<<"${compare}")" "${EXPECTED_HEAD_SHA}"
      - name: Check out the exact guarded release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_head_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: node
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up Corepack and pnpm
        id: pnpm
        run: bash scripts/setup-pnpm.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pnpm-store
        with:
          path: ${{ steps.pnpm.outputs.store-path }}
          key: pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ steps.pnpm.outputs.version }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'pnpm-workspace.yaml', '.npmrc', 'scripts/setup-pnpm.sh', '.node-version') }}
      # Always recreate node_modules and run approved native builds, even on a store hit.
      - run: pnpm install --frozen-lockfile
      - name: Validate the exact prepared dispatch before mutation
        run: |
          set -euo pipefail
          node scripts/production-release.mjs validate-dispatch /tmp/production-release
          node --input-type=module -e 'const plan=JSON.parse(process.env.PREPARED_PLAN_JSON); console.log(`FRESH_BASELINE_HANDOFF=${plan.fresh_baseline_handoff !== undefined}`);' >> "${GITHUB_ENV}"
      - name: Verify Cloudflare credential and immutable target
        run: node scripts/production-release-provider.mjs verify-target >/dev/null
      - name: Recheck live Production Release gates without mutation
        if: env.FRESH_BASELINE_HANDOFF != 'true'
        run: |
          set -euo pipefail
          result="$(node scripts/production-release-d1.mjs execute --config apps/ingestion/wrangler.jsonc --file /tmp/production-release/live-preflight.sql)"
          test "$(jq -r '.[-1].results[0].ready' <<<"${result}")" = 1
      - name: Claim the prepared pre-migration fence
        if: env.FRESH_BASELINE_HANDOFF != 'true'
        run: |
          set -euo pipefail
          result="$(node scripts/production-release-d1.mjs execute --config apps/ingestion/wrangler.jsonc --file /tmp/production-release/claim.sql)"
          test "$(jq -r '.[-1].results[0].changed_rows' <<<"${result}")" = 1
          test "$(jq -r '.[-1].results[0].claimed' <<<"${result}")" = 1
      - name: Apply compatible forward migrations
        if: env.FRESH_BASELINE_HANDOFF != 'true'
        run: |
          set -euo pipefail
          release_migration_exit() {
            original_status=$?
            trap - EXIT
            if test "${original_status}" -ne 0; then
              set +e
              bash scripts/production-release-failure.sh /tmp/production-release
              handler_status=$?
              printf 'Production Release failure handler status: %s\n' "${handler_status}"
              exit "${original_status}"
            fi
          }
          trap release_migration_exit EXIT
          marker="$(node scripts/production-release-d1.mjs execute --config apps/ingestion/wrangler.jsonc --file /tmp/production-release/migration-started.sql)"
          test "$(jq -r '.[-1].results[0].changed_rows' <<<"${marker}")" = 1
          test "$(jq -r '.[-1].results[0].migration_started' <<<"${marker}")" = 1
          pnpm exec wrangler d1 migrations apply CATALOGUE_DB --remote --config apps/ingestion/wrangler.jsonc
          trap - EXIT
      - name: Transfer the pre-migration fence to the durable Production Release
        if: env.FRESH_BASELINE_HANDOFF != 'true' && (inputs.bootstrap != 'true')
        run: |
          set -euo pipefail
          result="$(node scripts/production-release-d1.mjs execute --config apps/ingestion/wrangler.jsonc --file /tmp/production-release/materialize.sql)"
          test "$(jq -r '.[-1].results[0].transferred' <<<"${result}")" = 1
      - name: Transfer the pre-migration fence to the Production Release lease in Bootstrap Mode
        # No production_releases row can exist without a verified backup, so a
        # Bootstrap Mode Production Release holds the lease only and keeps its
        # phase evidence in the administration idempotency ledger.
        if: env.FRESH_BASELINE_HANDOFF != 'true' && (inputs.bootstrap == 'true')
        run: |
          set -euo pipefail
          result="$(node scripts/production-release-d1.mjs execute --config apps/ingestion/wrangler.jsonc --file /tmp/production-release/materialize.sql)"
          test "$(jq -r '.[-1].results[0].transferred' <<<"${result}")" = 1
      - name: Bind an exact verified replacement D1 when requested
        if: env.FRESH_BASELINE_HANDOFF != 'true'
        run: |
          set -euo pipefail
          api_config=apps/api/wrangler.release.json
          ingestion_config=apps/ingestion/wrangler.release.json
          release_state_config=apps/ingestion/wrangler.jsonc
          if test "${REPLACEMENT_DATABASE_ID}" = none; then
            cp apps/api/wrangler.jsonc "${api_config}"
            cp apps/ingestion/wrangler.jsonc "${ingestion_config}"
          else
            node scripts/production-release.mjs replacement-configs "${REPLACEMENT_DATABASE_ID}" "${api_config}" "${ingestion_config}"
            pnpm exec wrangler d1 migrations apply CATALOGUE_DB --remote --config "${ingestion_config}"
            handoff_result="$(node scripts/production-release-d1.mjs execute --config apps/ingestion/wrangler.jsonc --file /tmp/production-release/replacement-handoff.sql)"
            handoff="$(jq -er 'if length == 1 and (.[0].results | length) == 1 and (.[0].results[0].handoff_json | type) == "string" then .[0].results[0].handoff_json else error("invalid replacement handoff result") end' <<<"${handoff_result}")"
            KEEPR_REPLACEMENT_HANDOFF_EVIDENCE="${handoff}" node scripts/production-release.mjs replacement-seed /tmp/production-release/replacement-seed.sql
            seed_result="$(node scripts/production-release-d1.mjs execute --config "${ingestion_config}" --file /tmp/production-release/replacement-seed.sql)"
            test "$(jq -r '.[-1].results[0].seeded' <<<"${seed_result}")" = 1
            release_state_config="${ingestion_config}"
          fi
          printf 'API_RELEASE_CONFIG=%s\nINGESTION_RELEASE_CONFIG=%s\nRELEASE_STATE_CONFIG=%s\n' "${api_config}" "${ingestion_config}" "${release_state_config}" >> "${GITHUB_ENV}"
      - name: Upload immutable Worker versions
        if: env.FRESH_BASELINE_HANDOFF != 'true'
        run: |
          set -euo pipefail
          pnpm exec wrangler versions upload --strict --config "${API_RELEASE_CONFIG}" --tag "release-${RELEASE_ID}-api" --message "${RELEASE_ID} ${EXPECTED_HEAD_SHA}"
          pnpm exec wrangler versions upload --strict --config "${INGESTION_RELEASE_CONFIG}" --tag "release-${RELEASE_ID}-ingestion" --message "${RELEASE_ID} ${EXPECTED_HEAD_SHA}"
          result="$(node scripts/production-release-d1.mjs execute --config "${RELEASE_STATE_CONFIG}" --file /tmp/production-release/deploying.sql)"
          test "$(jq -r '.[-1].results[0].changed_rows' <<<"${result}")" = 1
          test "$(jq -r '.[-1].results[0].transitioned' <<<"${result}")" = 1
      - name: Verify the uploaded versions bind the release configuration
        if: env.FRESH_BASELINE_HANDOFF != 'true'
        run: |
          set -euo pipefail
          RELEASE_WORKER=card-keepr-api RELEASE_VERSION_TAG="release-${RELEASE_ID}-api" RELEASE_WORKER_CONFIG="${API_RELEASE_CONFIG}" node scripts/production-release-provider.mjs verify-version >/dev/null
          RELEASE_WORKER=card-keepr-ingestion RELEASE_VERSION_TAG="release-${RELEASE_ID}-ingestion" RELEASE_WORKER_CONFIG="${INGESTION_RELEASE_CONFIG}" node scripts/production-release-provider.mjs verify-version >/dev/null
      - name: Activate the compatible version pair
        if: env.FRESH_BASELINE_HANDOFF != 'true'
        run: |
          set -euo pipefail
          pnpm exec wrangler versions deploy --yes --config "${API_RELEASE_CONFIG}" --version-tag "release-${RELEASE_ID}-api@100%"
          pnpm exec wrangler versions deploy --yes --config "${INGESTION_RELEASE_CONFIG}" --version-tag "release-${RELEASE_ID}-ingestion@100%"
      - name: Deploy the route triggers
        if: env.FRESH_BASELINE_HANDOFF != 'true'
        # Versions carry code, vars, and bindings; zone routes are script-level
        # triggers that versions upload/deploy never apply (issue #123).
        run: |
          set -euo pipefail
          pnpm exec wrangler triggers deploy --config "${API_RELEASE_CONFIG}"
          pnpm exec wrangler triggers deploy --config "${INGESTION_RELEASE_CONFIG}"
      - name: Observe the binding while recovery remains blocked
        if: env.FRESH_BASELINE_HANDOFF != 'true'
        run: |
          set -euo pipefail
          binding="$(node scripts/production-release-provider.mjs observe-bindings)"
          KEEPR_RELEASE_EVIDENCE="${binding}" node scripts/production-release.mjs evidence-sql binding "${RELEASE_ID}" /tmp/production-release/binding.sql
          result="$(node scripts/production-release-d1.mjs execute --config "${RELEASE_STATE_CONFIG}" --file /tmp/production-release/binding.sql)"
          test "$(jq -r '.[-1].results[0].changed_rows' <<<"${result}")" = 1
          test "$(jq -r '.[-1].results[0].transitioned' <<<"${result}")" = 1
      - name: Run black-box production smoke checks
        if: env.FRESH_BASELINE_HANDOFF != 'true' && (inputs.bootstrap != 'true')
        run: |
          set -euo pipefail
          smoke_input="$(jq -cn --arg url "${API_BASE_URL}" --arg key "${API_TRAFFIC_TOKEN}" --arg revision "${EXPECTED_CURRENT_REVISION}" --argjson targets "${SMOKE_TARGETS_JSON}" '{apiUrl:$url,apiKey:$key,currentRevisionId:$revision,revisions:$targets.revisions,printingImageId:$targets.printing_image_id,staleCursor:$targets.stale_cursor,staleRevisionId:$targets.stale_revision_id}')"
          smoke="$(KEEPR_SMOKE_INPUT="${smoke_input}" node scripts/production-smoke.mjs)"
          KEEPR_RELEASE_EVIDENCE="${smoke}" node scripts/production-release.mjs evidence-sql smoke "${RELEASE_ID}" /tmp/production-release/smoke.sql
          result="$(node scripts/production-release-d1.mjs execute --config "${RELEASE_STATE_CONFIG}" --file /tmp/production-release/smoke.sql)"
          test "$(jq -r '.[-2].results[0].changed_rows' <<<"${result}")" = 1
          test "$(jq -r '.[-2].results[0].transitioned' <<<"${result}")" = 1
          test "$(jq -r '.[-1].results[0].changed_rows' <<<"${result}")" = 1
          test "$(jq -r '.[-1].results[0].fence_released' <<<"${result}")" = 1
      - name: Run reduced Bootstrap Mode smoke checks
        # An empty catalogue has no Card, Printing, export, or retained
        # revision to read: only health and auth on both mounts and the spine
        # revision from /v1/catalogue are checked. Nothing is rolled back.
        if: env.FRESH_BASELINE_HANDOFF != 'true' && (inputs.bootstrap == 'true')
        run: |
          set -euo pipefail
          ingestion_url="$(node --input-type=module -e 'import { readFile } from "node:fs/promises"; process.stdout.write(String(JSON.parse(await readFile(process.argv[1], "utf8")).vars.PUBLIC_BASE_URL));' "${INGESTION_RELEASE_CONFIG}")"
          smoke_input="$(jq -cn --arg url "${API_BASE_URL}" --arg key "${API_TRAFFIC_TOKEN}" --arg ingestion "${ingestion_url}" --arg revision "${EXPECTED_CURRENT_REVISION}" '{apiUrl:$url,apiKey:$key,ingestionUrl:$ingestion,currentRevisionId:$revision}')"
          smoke="$(KEEPR_SMOKE_INPUT="${smoke_input}" node scripts/production-smoke.mjs bootstrap)"
          KEEPR_RELEASE_EVIDENCE="${smoke}" node scripts/production-release.mjs evidence-sql smoke "${RELEASE_ID}" /tmp/production-release/smoke.sql
          result="$(node scripts/production-release-d1.mjs execute --config "${RELEASE_STATE_CONFIG}" --file /tmp/production-release/smoke.sql)"
          test "$(jq -r '.[-2].results[0].changed_rows' <<<"${result}")" = 1
          test "$(jq -r '.[-2].results[0].transitioned' <<<"${result}")" = 1
          test "$(jq -r '.[-1].results[0].changed_rows' <<<"${result}")" = 1
          test "$(jq -r '.[-1].results[0].fence_released' <<<"${result}")" = 1
      - name: Record compatible roll-forward requirement on failure
        if: env.FRESH_BASELINE_HANDOFF != 'true' && (failure())
        run: |
          set +e
          bash scripts/production-release-failure.sh /tmp/production-release
          handler_status=$?
          exit "${handler_status}"
      - name: Execute the guarded fresh-baseline handoff
        if: env.FRESH_BASELINE_HANDOFF == 'true'
        run: node scripts/fresh-baseline-release.mjs /tmp/production-release
      - name: Preserve unfinished fresh-baseline authority on failure
        if: failure() && env.FRESH_BASELINE_HANDOFF == 'true'
        run: |
          printf 'Fresh-baseline handoff failed or was interrupted. Both durable fences remain; resume the exact confirmed release. No cleanup or lease expiry authorizes mutation.\n'
