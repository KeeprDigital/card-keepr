name: production-release
run-name: production-release-credential-boundary-${{ inputs.secret_slot }}-${{ inputs.expected_token_id }}-${{ inputs.expected_status }}-${{ inputs.expected_fingerprint }}-${{ inputs.plan_digest }}

on:
  workflow_dispatch:
    inputs:
      expected_account_id:
        required: true
        type: string
      expected_token_id:
        required: true
        type: string
      plan_digest:
        required: true
        type: string
      plan_nonce:
        required: true
        type: string
      expected_head_sha:
        required: true
        type: string
      expected_actor:
        required: true
        type: string
      expected_status:
        required: true
        type: choice
        options:
          - usable
          - unusable
      expected_fingerprint:
        required: true
        type: string
      secret_slot:
        required: true
        type: choice
        options:
          - active
          - replacement

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out the exact guarded release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_head_sha }}
      - name: Select active deployment credential
        if: inputs.secret_slot == 'active'
        env:
          SELECTED_DEPLOYMENT_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOYMENT_TOKEN }}
        run: |
          set -euo pipefail
          printf 'CLOUDFLARE_API_TOKEN=%s\n' \
            "${SELECTED_DEPLOYMENT_TOKEN}" >> "${GITHUB_ENV}"
      - name: Select replacement deployment credential
        if: inputs.secret_slot == 'replacement'
        env:
          SELECTED_DEPLOYMENT_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOYMENT_TOKEN_REPLACEMENT }}
        run: |
          set -euo pipefail
          printf 'CLOUDFLARE_API_TOKEN=%s\n' \
            "${SELECTED_DEPLOYMENT_TOKEN}" >> "${GITHUB_ENV}"
      - name: Verify guarded credential and deploy production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.expected_account_id }}
          EXPECTED_ACCOUNT_ID: ${{ inputs.expected_account_id }}
          EXPECTED_TOKEN_ID: ${{ inputs.expected_token_id }}
          PLAN_DIGEST: ${{ inputs.plan_digest }}
          PLAN_NONCE: ${{ inputs.plan_nonce }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_ACTOR: ${{ inputs.expected_actor }}
          EXPECTED_STATUS: ${{ inputs.expected_status }}
          EXPECTED_FINGERPRINT: ${{ inputs.expected_fingerprint }}
          SECRET_SLOT: ${{ inputs.secret_slot }}
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "${EXPECTED_HEAD_SHA}"
          test "${GITHUB_ACTOR}" = "${EXPECTED_ACTOR}"
          if test "${EXPECTED_STATUS}" = "usable"; then
            actual_fingerprint="$(printf '%s' "${CLOUDFLARE_API_TOKEN}" |
              sha256sum | awk '{print $1}')"
            test "sha256:${actual_fingerprint}" = "${EXPECTED_FINGERPRINT}"
            verify="$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${EXPECTED_ACCOUNT_ID}/tokens/verify")"
            test "$(jq -r '.success' <<<"${verify}")" = "true"
            test "$(jq -r '.result.id' <<<"${verify}")" = "${EXPECTED_TOKEN_ID}"
            test "$(jq -r '.result.status' <<<"${verify}")" = "active"
            npm ci
            release_fence="release_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_$(cat /proc/sys/kernel/random/uuid)"
            bootstrap_expires_at="$(date -u -d '+35 minutes' '+%Y-%m-%dT%H:%M:%S.000Z')"
            bootstrap_lease="release-bootstrap|${bootstrap_expires_at}|${release_fence}"
            cleanup_release_lock() {
              release_cleanup_sql="UPDATE operation_state SET active_release_id = NULL, active_release_expires_at = NULL WHERE singleton = 1 AND active_release_id = '${release_fence}';"
              npx wrangler d1 execute CATALOGUE_DB --remote --config apps/ingestion/wrangler.jsonc --command "${release_cleanup_sql}" || true
              bootstrap_failure_sql="UPDATE ingestion_runs SET state = 'failed', terminal_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now'), failure_code = 'production_release_bootstrap_abandoned', progress_json = '{\"completed_stages\":[],\"current_stage\":\"failed\"}' WHERE id = '${bootstrap_lease}' AND state = 'planning' AND EXISTS (SELECT 1 FROM operation_state WHERE singleton = 1 AND active_ingestion_run_id = '${bootstrap_lease}');"
              npx wrangler d1 execute CATALOGUE_DB --remote --config apps/ingestion/wrangler.jsonc --command "${bootstrap_failure_sql}" || true
              bootstrap_cleanup_sql="UPDATE operation_state SET active_ingestion_run_id = NULL WHERE singleton = 1 AND active_ingestion_run_id = '${bootstrap_lease}'; DELETE FROM ingestion_run_transitions WHERE ingestion_run_id = '${bootstrap_lease}' AND EXISTS (SELECT 1 FROM ingestion_runs WHERE id = '${bootstrap_lease}' AND idempotency_key = id AND selected_games_json = '[]' AND candidate_json = '{\"production_release_bootstrap\":true}' AND state IN ('planning', 'failed') AND NOT EXISTS (SELECT 1 FROM operation_state WHERE singleton = 1 AND active_ingestion_run_id = ingestion_runs.id)); DELETE FROM ingestion_runs WHERE id = '${bootstrap_lease}' AND idempotency_key = id AND selected_games_json = '[]' AND candidate_json = '{\"production_release_bootstrap\":true}' AND state IN ('planning', 'failed') AND NOT EXISTS (SELECT 1 FROM operation_state WHERE singleton = 1 AND active_ingestion_run_id = ingestion_runs.id);"
              npx wrangler d1 execute CATALOGUE_DB --remote --config apps/ingestion/wrangler.jsonc --command "${bootstrap_cleanup_sql}" || true
            }
            trap cleanup_release_lock EXIT
            bootstrap_claim_sql="UPDATE ingestion_runs SET state = 'failed', terminal_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now'), failure_code = 'production_release_bootstrap_expired', progress_json = '{\"completed_stages\":[],\"current_stage\":\"failed\"}' WHERE id = (SELECT active_ingestion_run_id FROM operation_state WHERE singleton = 1) AND id LIKE 'release-bootstrap|%' AND idempotency_key = id AND selected_games_json = '[]' AND candidate_json = '{\"production_release_bootstrap\":true}' AND state = 'planning' AND substr(id, 19, 24) <= strftime('%Y-%m-%dT%H:%M:%fZ', 'now'); UPDATE operation_state SET active_ingestion_run_id = NULL WHERE singleton = 1 AND active_ingestion_run_id LIKE 'release-bootstrap|%' AND substr(active_ingestion_run_id, 19, 24) <= strftime('%Y-%m-%dT%H:%M:%fZ', 'now'); INSERT INTO ingestion_runs (id, state, selected_games_json, started_at, expected_current_revision_id, idempotency_key, candidate_json) SELECT '${bootstrap_lease}', 'planning', '[]', strftime('%Y-%m-%dT%H:%M:%fZ', 'now'), current_revision_id, '${bootstrap_lease}', '{\"production_release_bootstrap\":true}' FROM catalogue_state WHERE singleton = 1; UPDATE operation_state SET active_ingestion_run_id = '${bootstrap_lease}' WHERE singleton = 1 AND recovery_health = 'healthy' AND active_ingestion_run_id IS NULL; SELECT CASE WHEN active_ingestion_run_id = '${bootstrap_lease}' THEN 1 ELSE 0 END AS claimed FROM operation_state WHERE singleton = 1;"
            bootstrap_claim="$(npx wrangler d1 execute CATALOGUE_DB --remote --json --config apps/ingestion/wrangler.jsonc --command "${bootstrap_claim_sql}")"
            test "$(jq -r '.[-1].results[0].claimed' <<<"${bootstrap_claim}")" = "1"
            npx wrangler d1 migrations apply CATALOGUE_DB --remote --config apps/ingestion/wrangler.jsonc
            release_expires_at="$(date -u -d '+15 minutes' '+%Y-%m-%dT%H:%M:%S.000Z')"
            transfer_sql="UPDATE operation_state SET active_release_id = '${release_fence}', active_release_expires_at = '${release_expires_at}', active_ingestion_run_id = NULL WHERE singleton = 1 AND active_ingestion_run_id = '${bootstrap_lease}' AND (active_release_id IS NULL OR active_release_expires_at <= strftime('%Y-%m-%dT%H:%M:%fZ', 'now')); DELETE FROM ingestion_run_transitions WHERE EXISTS (SELECT 1 FROM ingestion_runs AS run WHERE run.id = ingestion_run_transitions.ingestion_run_id AND run.id LIKE 'release-bootstrap|%' AND run.idempotency_key = run.id AND run.selected_games_json = '[]' AND run.candidate_json = '{\"production_release_bootstrap\":true}' AND run.state IN ('planning', 'failed') AND NOT EXISTS (SELECT 1 FROM operation_state WHERE singleton = 1 AND active_ingestion_run_id = run.id)); DELETE FROM ingestion_runs WHERE id LIKE 'release-bootstrap|%' AND idempotency_key = id AND selected_games_json = '[]' AND candidate_json = '{\"production_release_bootstrap\":true}' AND state IN ('planning', 'failed') AND NOT EXISTS (SELECT 1 FROM operation_state WHERE singleton = 1 AND active_ingestion_run_id = ingestion_runs.id); SELECT CASE WHEN active_release_id = '${release_fence}' AND active_ingestion_run_id IS NULL THEN 1 ELSE 0 END AS claimed FROM operation_state WHERE singleton = 1;"
            transfer="$(npx wrangler d1 execute CATALOGUE_DB --remote --json --config apps/ingestion/wrangler.jsonc --command "${transfer_sql}")"
            test "$(jq -r '.[-1].results[0].claimed' <<<"${transfer}")" = "1"
            renew_release_lease() {
              release_expires_at="$(date -u -d '+15 minutes' '+%Y-%m-%dT%H:%M:%S.000Z')"
              renew_sql="UPDATE operation_state SET active_release_expires_at = '${release_expires_at}' WHERE singleton = 1 AND active_release_id = '${release_fence}' AND active_release_expires_at > strftime('%Y-%m-%dT%H:%M:%fZ', 'now'); SELECT changes() AS claimed;"
              renewed="$(npx wrangler d1 execute CATALOGUE_DB --remote --json --config apps/ingestion/wrangler.jsonc --command "${renew_sql}")"
              test "$(jq -r '.[-1].results[0].claimed' <<<"${renewed}")" = "1"
            }
            run_with_release_lease() {
              setsid "$@" &
              command_pid=$!
              command_status=0
              while kill -0 "${command_pid}" 2>/dev/null; do
                sleep 30
                if kill -0 "${command_pid}" 2>/dev/null && ! renew_release_lease; then
                  kill -- "-${command_pid}" 2>/dev/null || true
                  wait "${command_pid}" || true
                  return 1
                fi
              done
              wait "${command_pid}" || command_status=$?
              return "${command_status}"
            }
            renew_release_lease
            run_with_release_lease npx wrangler deploy --config apps/api/wrangler.jsonc
            run_with_release_lease npx wrangler deploy --config apps/ingestion/wrangler.jsonc
            for worker in card-keepr-api card-keepr-ingestion; do
              renew_release_lease
              deployments="$(curl --fail-with-body --silent --show-error --max-time 60 \
                --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                "https://api.cloudflare.com/client/v4/accounts/${EXPECTED_ACCOUNT_ID}/workers/scripts/${worker}/deployments")"
              test "$(jq -r '.success' <<<"${deployments}")" = "true"
              test "$(jq -r '.result.deployments | type' <<<"${deployments}")" = "array"
              test "$(jq -r '.result.deployments | length > 0' <<<"${deployments}")" = "true"
            done
          else
            test -z "${CLOUDFLARE_API_TOKEN}"
          fi
          printf 'KEEPR_CREDENTIAL_PROOF plan_digest=%s plan_nonce=%s head_sha=%s token_id=%s actor=%s slot=%s\n' \
            "${PLAN_DIGEST}" "${PLAN_NONCE}" "${GITHUB_SHA}" "${EXPECTED_TOKEN_ID}" "${GITHUB_ACTOR}" "${SECRET_SLOT}"
