name: credential-boundary-probe
run-name: credential-boundary-probe-${{ inputs.secret_slot }}-${{ inputs.expected_token_id }}-${{ inputs.plan_nonce }}-${{ inputs.plan_digest }}

on:
  workflow_dispatch:
    inputs:
      expected_account_id:
        required: true
        type: string
      expected_token_id:
        required: true
        type: string
      plan_digest:
        required: true
        type: string
      plan_nonce:
        required: true
        type: string
      expected_head_sha:
        required: true
        type: string
      expected_actor:
        required: true
        type: string
      secret_slot:
        required: true
        type: choice
        options:
          - active
          - replacement

permissions:
  contents: read

jobs:
  verify-installed-deployment-credential:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify exact installed token and deployment capability
        env:
          CLOUDFLARE_API_TOKEN: ${{ inputs.secret_slot == 'active' && secrets.CLOUDFLARE_DEPLOYMENT_TOKEN || secrets.CLOUDFLARE_DEPLOYMENT_TOKEN_REPLACEMENT }}
          EXPECTED_ACCOUNT_ID: ${{ inputs.expected_account_id }}
          EXPECTED_TOKEN_ID: ${{ inputs.expected_token_id }}
          PLAN_DIGEST: ${{ inputs.plan_digest }}
          PLAN_NONCE: ${{ inputs.plan_nonce }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_ACTOR: ${{ inputs.expected_actor }}
          SECRET_SLOT: ${{ inputs.secret_slot }}
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "${EXPECTED_HEAD_SHA}"
          test "${GITHUB_ACTOR}" = "${EXPECTED_ACTOR}"
          verify="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${EXPECTED_ACCOUNT_ID}/tokens/verify")"
          test "$(jq -r '.success' <<<"${verify}")" = "true"
          test "$(jq -r '.result.id' <<<"${verify}")" = "${EXPECTED_TOKEN_ID}"
          test "$(jq -r '.result.status' <<<"${verify}")" = "active"
          deployments="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${EXPECTED_ACCOUNT_ID}/workers/services/card-keepr-ingestion/environments/production/deployments")"
          test "$(jq -r '.success' <<<"${deployments}")" = "true"
          printf 'KEEPR_CREDENTIAL_PROOF plan_digest=%s plan_nonce=%s head_sha=%s token_id=%s actor=%s slot=%s\n' \
            "${PLAN_DIGEST}" "${PLAN_NONCE}" "${GITHUB_SHA}" "${EXPECTED_TOKEN_ID}" "${GITHUB_ACTOR}" "${SECRET_SLOT}"
