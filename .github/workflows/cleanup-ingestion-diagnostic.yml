name: cleanup ingestion diagnostic
on:
  push:
    branches: [codex/cleanup-ingestion-diagnostic]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        selection: [live, quiet]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 30d88b9b047b2d134276022875aa021159dc6882
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        id: node
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache
        with:
          path: node_modules
          key: node-modules-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'package.json', '.npmrc') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Focused reproduction with host samples
        timeout-minutes: 6
        env:
          SELECTION: ${{ matrix.selection }}
        run: |
          mkdir -p diagnostic-output
          (while true; do date -u; free -m; ps -eo pid,ppid,pcpu,rss,stat,comm --sort=-rss | head -12; df -m -t tmpfs; sleep 10; done) | tee diagnostic-output/host.log &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          logging=false
          if [ "$SELECTION" = quiet ]; then logging=passed-only; fi
          set -o pipefail
          bash scripts/ci-test.sh npm run test:workers:ingestion -- apps/ingestion/test/source-refresh-publication.spec.ts apps/ingestion/test/native-printing-images.spec.ts --reporter=default --silent="$logging" 2>&1 | tee diagnostic-output/tests.log
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cleanup-${{ matrix.selection }}
          path: diagnostic-output/
