name: cleanup ingestion diagnostic
on:
  push:
    branches: [codex/cleanup-ingestion-diagnostic]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        selection: [timing, progress]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 122c6be416a370255fbbb7bbc69d06ac81f1b370
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        id: node
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache
        with:
          path: node_modules
          key: node-modules-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'package.json', '.npmrc') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Focused reproduction with host samples
        timeout-minutes: 6
        env:
          SELECTION: ${{ matrix.selection }}
        run: |
          mkdir -p diagnostic-output
          (while true; do date -u; free -m; ps -eo pid,ppid,pcpu,rss,stat,comm --sort=-rss | head -12; df -m -t tmpfs; sleep 10; done) | tee diagnostic-output/host.log &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          if [ "$SELECTION" = timing ]; then
            bash scripts/ci-test.sh npm run test:workers:ingestion -- apps/ingestion/test/reconciliation-card-identity.spec.ts apps/ingestion/test/reconciliation-curated-lookup.spec.ts apps/ingestion/test/reconciliation-provenance-locators.spec.ts apps/ingestion/test/reconciliation-workflow-binding.spec.ts apps/ingestion/test/game-reconciliation-operations.spec.ts apps/ingestion/test/publication-caller-retirement.spec.ts -t 'Gundam EN-ASIA and EN-US|Gundam cross-locale formatting|Gundam shared-fact conflict blocks|curated .* lookup|locator variant evolution|parsed observation count warnings|native source change retains reconfirmable|a repeated native publication' > diagnostic-output/tests.log 2>&1
          else
            bash scripts/ci-test.sh npm run test:workers:ingestion -- apps/ingestion/test/identity-corrections.spec.ts apps/ingestion/test/reconciliation-completeness-profiles.spec.ts > diagnostic-output/tests.log 2>&1
          fi
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cleanup-${{ matrix.selection }}
          path: diagnostic-output/
