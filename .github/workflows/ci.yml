name: ci

# Pull requests build refs/pull/N/merge, the PR merged into main as of the
# run, so a second run on the resulting push to main would test the same
# tree. Main is therefore not run on push; use workflow_dispatch when needed.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A push to a pull request supersedes the run in flight for it; a manual run
# is keyed by its ref so it never cancels a pull request's run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Every job id here is a required check of the guarded production release
# (production-release.yml resolves the dispatched SHA's ci check runs), and
# acceptance/production-release-contract.test.mjs keeps the two lists equal.
jobs:
  # Biome lints the whole tree and formats only the files a pull request
  # changes (biome.jsonc explains the ratchet). fetch-depth 0 makes the base
  # branch reachable for the changed-file diff.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_REF: ${{ github.base_ref || 'main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run lint
      - run: npm run format:check -- --since="origin/${BASE_REF}"

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run typecheck
      - run: npm run types:check
      - run: npm run deploy:dry-run
      - run: npm run test:workers:api

  # Runtime-free catalogue tests (parsers, reconciliation identity, legality,
  # export, contract checks) run under plain node vitest: no Workers pool, no
  # wrangler boot, so this job finishes in well under a minute.
  domain-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run test:domain

  ingestion-tests:
    runs-on: ubuntu-latest
    # A shard normally finishes in ~4 min. The workers pool occasionally
    # wedges in per-file teardown after every test has passed (seen on main
    # before sharding); the cap bounds what such a hang costs.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run test:workers:ingestion -- --shard=${{ matrix.shard }}/3

  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run test:acceptance:shard -- --shard=${{ matrix.shard }}/3
