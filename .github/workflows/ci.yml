name: diagnostic-private-launch

# Temporary diagnostic branch only. This job is not a release check and this
# branch must never be merged. It cannot satisfy the required CI job set.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-product-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: Measure the native Product callback on an isolated hosted runner
        env:
          KEEPR_TEST_SUITE: stress
          KEEPR_CALLBACK_ARTIFACT: ${{ runner.temp }}/native-product-callbacks.json
        run: node node_modules/vitest/vitest.mjs run --config apps/ingestion/vitest.config.ts --maxWorkers=1 --reporter=default --reporter=./test/support/reconciliation-callback-reporter.mjs apps/ingestion/test/game-reconciliation-scale.stress.spec.ts
      - name: Retain callback evidence even on budget failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-product-callbacks
          path: ${{ runner.temp }}/native-product-callbacks.json
          if-no-files-found: error
