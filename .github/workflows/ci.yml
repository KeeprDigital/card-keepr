name: ci

# Pull requests build refs/pull/N/merge, the PR merged into main as of the
# run. That tree only matches the eventual merge when the PR was current with
# main at run time, which parallel merges routinely violate, so main is also
# run on push. The concurrency group below cancels a superseded main run, so
# a burst of merges tests only the newest tree.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A push to a pull request supersedes the run in flight for it; a push to
# main supersedes the main run in flight. Manual runs have a separate group
# so diagnostics cannot cancel the main commit's release evidence.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Every job id here is a required check of the guarded production release
# (production-release.yml resolves the dispatched SHA's ci check runs), and
# acceptance/production-release-contract.test.mjs keeps the two lists equal.
jobs:
  # Biome lints the whole tree and formats only the files a pull request
  # changes (biome.jsonc explains the ratchet). fetch-depth 0 makes the base
  # branch reachable for the changed-file diff.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_REF: ${{ github.base_ref || 'main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: node
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-modules
        with:
          path: node_modules
          key: node-modules-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'package.json', '.npmrc') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run lint
      - run: npm run format:check -- --since="origin/${BASE_REF}"

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: node
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-modules
        with:
          path: node_modules
          key: node-modules-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'package.json', '.npmrc') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run typecheck
      - run: npm run check:generated
      - run: npm run check:imports
      - run: npm run build
      - run: npm run test:api

  # The local quick check is split across checks (API) and this job (domain
  # plus bounded publication/restore and external CLI smoke). Both run on drafts.
  domain-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: node
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-modules
        with:
          path: node_modules
          key: node-modules-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'package.json', '.npmrc') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run test:domain
      # Full acceptance already includes smoke; only drafts need it here.
      - if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: bash scripts/ci-test.sh npm run test:acceptance:smoke

  # Full integration runs when a PR is ready, on main, and on manual dispatch.
  # The ready_for_review event above also runs it without requiring a new push.
  ingestion-tests:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # Bound regressions and runtime teardown hangs, including setup time.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: node
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-modules
        with:
          path: node_modules
          key: node-modules-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'package.json', '.npmrc') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: bash scripts/ci-test.sh npm run test:ingestion -- --shard=${{ matrix.shard }}/3 --silent=passed-only --reporter=default --reporter=json --outputFile.json=test-results/ingestion.json
      # Preserve per-test timings and failure details from this exact shard. A
      # failed run should be diagnosable without creating a diagnostic workflow.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ingestion-results-${{ matrix.shard }}
          path: test-results/ingestion.json
          retention-days: 7

  # Routine acceptance only; full publisher/recovery journeys are explicit opt-in.
  # The shared runner caps each shard at two concurrent test files.
  acceptance:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: node
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-modules
        with:
          path: node_modules
          key: node-modules-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'package.json', '.npmrc') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: bash scripts/ci-test.sh npm run test:acceptance -- --shard=${{ matrix.shard }}/3
