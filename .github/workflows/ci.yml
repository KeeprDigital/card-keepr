name: diagnostic-private-launch

# Manual-only diagnostic. Never merge this workflow or use it as release CI.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  riftbound-preparation-duration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: Run the complete retained Riftbound owner and restore journey
        env:
          KEEPR_RIFTBOUND_METRICS_PATH: /tmp/riftbound-metrics.json
        run: |
          set +e
          /usr/bin/time -v timeout 3300s node --test acceptance/riftbound-catalogue.test.mjs > /tmp/riftbound-preparation.log 2>&1
          result=$?
          tail -80 /tmp/riftbound-preparation.log
          exit "$result"
      - name: Preserve natural completion or explicit bounded failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riftbound-preparation-duration
          path: |
            /tmp/riftbound-preparation.log
            /tmp/riftbound-metrics.json
          if-no-files-found: error
