name: diagnostic-private-launch

# Diagnostic branch only. Never merge this workflow or count it as required CI.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity-correction-duration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: Measure all native identity correction journeys
        shell: bash
        run: |
          set +e
          /usr/bin/time -v timeout 1800s node node_modules/vitest/vitest.mjs run --config apps/ingestion/vitest.config.ts --maxWorkers=1 --testTimeout=120000 --reporter=default apps/ingestion/test/identity-corrections.spec.ts > /tmp/native-identity-corrections.log 2>&1
          result=$?
          tail -100 /tmp/native-identity-corrections.log
          exit "$result"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-identity-corrections-evidence
          path: /tmp/native-identity-corrections.log
          if-no-files-found: error
