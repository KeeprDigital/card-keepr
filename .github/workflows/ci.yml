name: diagnostic-private-launch

# Diagnostic branch only. Never merge this workflow or use it as release proof.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-curation-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: Measure two complete curation journeys on an isolated hosted runner
        shell: bash
        run: |
          set +e
          /usr/bin/time -v timeout 300s node node_modules/vitest/vitest.mjs run --config apps/ingestion/vitest.config.ts --maxWorkers=1 --reporter=default apps/ingestion/test/reconciliation-curated-conflicts.spec.ts apps/ingestion/test/reconciliation-progress.spec.ts -t 'all 32 changed Curated Revisions|persistent curated edits retain Release ownership' > /tmp/native-curation.log 2>&1
          result=$?
          tail -80 /tmp/native-curation.log
          exit "$result"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-curation-hosted-evidence
          path: /tmp/native-curation.log
          if-no-files-found: error
