name: diagnostic-271-identity

# Temporary diagnostic branch only. This job is not a release check and this
# branch must never be merged. It cannot satisfy the required CI job set.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: Repeat the original identity sequence with corrected fixture reset
        run: node node_modules/vitest/vitest.mjs run --config apps/ingestion/vitest.config.ts --maxWorkers=1 apps/ingestion/test/identity-corrections.spec.ts -t 'reviewed identity.*prepare through durable bounded groups'
