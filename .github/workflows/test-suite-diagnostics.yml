name: test-suite-diagnostics
on:
  push:
    branches: [codex/streamline-testing-ci]
    paths:
      - .github/workflows/test-suite-diagnostics.yml
      - acceptance/helpers/**
      - acceptance/errata-runtime.test.mjs
      - apps/ingestion/test/source-refresh-publication.spec.ts
      - test/support/fake-publisher/reconciliation-documents.ts
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [worker, acceptance]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: matrix.suite == 'worker'
        run: |
          for attempt in 1 2 3; do
            echo "Focused Worker check ${attempt}/3"
            bash scripts/ci-test.sh npm run test:workers:ingestion -- apps/ingestion/test/identity-corrections.spec.ts apps/ingestion/test/reconciliation-workflow-binding.spec.ts apps/ingestion/test/source-refresh-publication.spec.ts -t 'reviewed identity .* prepare through durable bounded groups|parsed observation count warnings|unexplained substantial coverage loss'
          done
      - if: matrix.suite == 'acceptance'
        run: |
          for attempt in 1 2 3; do
            echo "Focused acceptance check ${attempt}/3"
            bash scripts/ci-test.sh node --test --test-concurrency=2 --test-timeout=120000 acceptance/errata-runtime.test.mjs acceptance/gundam-catalogue.test.mjs acceptance/product-catalogue.test.mjs acceptance/source-evidence-cli.test.mjs
          done
