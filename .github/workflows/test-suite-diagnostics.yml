name: test-suite-diagnostics

# A focused reproduction is diagnostic evidence, never a substitute for ci.
on:
  workflow_dispatch:
    inputs:
      worker:
        description: Worker suite
        type: choice
        options: [ingestion, api]
        default: ingestion
      files:
        description: Space-separated test file paths, relative to the repository
        required: true
        type: string
      repeats:
        description: Independent runs for a suspected flake (failures are never retried away)
        type: choice
        options: ["1", "3"]
        default: "1"
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TEST_WORKER: ${{ inputs.worker }}
      TEST_FILES: ${{ inputs.files }}
      TEST_REPEATS: ${{ inputs.repeats }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: node
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up Corepack and pnpm
        id: pnpm
        run: bash scripts/setup-pnpm.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pnpm-store
        with:
          path: ${{ steps.pnpm.outputs.store-path }}
          key: pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ steps.pnpm.outputs.version }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'pnpm-workspace.yaml', '.npmrc', 'scripts/setup-pnpm.sh', '.node-version') }}
      # Always recreate node_modules and run approved native builds, even on a store hit.
      - run: pnpm install --frozen-lockfile
      - name: Run the selected files
        run: |
          case "$TEST_WORKER" in ingestion|api) ;; *) exit 2 ;; esac
          case "$TEST_REPEATS" in 1|3) ;; *) exit 2 ;; esac
          read -r -a files <<< "$TEST_FILES"
          if [ "${#files[@]}" -eq 0 ]; then exit 2; fi
          for file in "${files[@]}"; do
            if [[ ! "$file" =~ ^apps/$TEST_WORKER/test/[a-z0-9-]+\.spec\.ts$ ]] || [ ! -f "$file" ]; then
              echo "Invalid test file: $file" >&2
              exit 2
            fi
          done
          mkdir -p test-results
          status=0
          for ((run=1; run<=TEST_REPEATS; run++)); do
            bash scripts/ci-test.sh pnpm run "test:$TEST_WORKER" "${files[@]}" \
              --silent=passed-only --reporter=default --reporter=json \
              --outputFile.json="test-results/run-$run.json" || status=1
          done
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: focused-test-results
          path: test-results/
          retention-days: 7
