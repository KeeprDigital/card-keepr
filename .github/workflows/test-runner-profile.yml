name: test-runner-profile
on:
  push:
    branches: [codex/streamline-testing-ci]
    paths: [.github/workflows/test-runner-profile.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compare the same publication tests at each concurrency
        run: |
          nproc
          test_tmp=$(mktemp -d)
          sudo mount -t tmpfs -o "size=512m,mode=0700,uid=$(id -u),gid=$(id -g)" tmpfs "$test_tmp"
          trap 'sudo umount "$test_tmp"; rmdir "$test_tmp"' EXIT
          TMPDIR="$test_tmp" /usr/bin/time -v npm run test:workers:ingestion -- apps/ingestion/test/reconciliation-workflow-binding.spec.ts apps/ingestion/test/identity-corrections.spec.ts --maxWorkers=${{ matrix.workers }} -t 'retained immutable evidence publishes stable identities|reviewed Card merge retains its decision'
