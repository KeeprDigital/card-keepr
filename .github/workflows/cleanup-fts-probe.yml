name: cleanup FTS fixture probe
on:
  push:
    branches: [codex/finish-cleanup-reliability]
permissions:
  contents: read
jobs:
  focused-fts:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: npm ci
      - name: Measure original fixture on the same runner
        run: |
          git show origin/main:test/domain/card-search-recovery.test.mjs > test/domain/card-search-recovery.test.mjs
          result=0
          npm run test:domain -- test/domain/card-search-recovery.test.mjs || result=$?
          echo "Original fixture exit code: $result"
          git restore test/domain/card-search-recovery.test.mjs
      - name: Verify corrected fixture three times
        run: |
          for iteration in 1 2 3; do
            npm run test:domain -- test/domain/card-search-recovery.test.mjs
          done
