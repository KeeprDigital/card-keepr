# Corepack selects pnpm; neither pnpm nor a task runner downloads another runtime.
pmOnFail: error
runtimeOnFail: error
strictPeerDependencies: true
# Review native builds explicitly and rerun them after restoring the source store.
strictDepBuilds: true
sideEffectsCache: false
allowBuilds:
  esbuild: true
  workerd: true
# Keep the parser edge distinct from the direct entities@8.1.0 dependency.
overrides:
  "parse5>entities": 8.0.0
